name: Deploy Heart Island to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: "/aftergrow"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Prepare GitHub Pages directory
        run: |
          cp dist/client/aftergrow.html dist/client/aftergrow/index.html
          cp dist/client/404.html dist/client/aftergrow/404.html
          mkdir -p dist/client/aftergrow/_next/static/fonts
          cp -R dist/client/aftergrow/fonts/. dist/client/aftergrow/_next/static/fonts/

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/aftergrow

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
